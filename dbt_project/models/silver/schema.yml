version: 2

# =============================================================================
# SILVER CONTRACTS — viết TRƯỚC model SQL (tests là hợp đồng data, gác cổng build).
# Silver = current-state: MỖI primary key ĐÚNG MỘT dòng, bản mới nhất.
# Nguồn xoá dòng -> soft-delete (is_deleted=true), không mất dấu vết audit.
# PII bị mask NGAY TẠI ĐÂY — analyst chỉ chạm tầng này trở lên.
# =============================================================================

models:
  - name: transactions
    description: >
      Current state of every transaction the source has ever emitted — one row per
      txn_id, collapsed from the Bronze CDC log by latest Kafka offset. Retention-purged
      FAILED rows are kept with is_deleted=true (soft delete) so the audit trail never
      loses a row that once existed. NOT financial truth by itself: COMPLETED is real
      money, FAILED never moved money, REVERSED was undone — Gold applies those rules.
    columns:
      - name: txn_id
        description: Transaction primary key from the source system.
        data_tests: [unique, not_null]
      - name: account_id
        description: Originating account (FK to silver.accounts).
        data_tests:
          - not_null
          - relationships:
              to: ref('accounts')
              field: account_id
      - name: merchant_id
        description: >
          Merchant involved (FK to silver.merchants). NULL for TRANSFER and SALARY,
          which belong to no merchant. There is deliberately NO not_null test here:
          "must be present" is not a property of the column, it is a property of the
          transaction TYPE, and a blanket not_null cannot express that. The real rule
          is enforced both ways in tests/assert_transfer_rules.sql — purchases must
          have a merchant, transfers and payroll must not.
        data_tests:
          - relationships:
              to: ref('merchants')
              field: merchant_id
      - name: counterparty_account_id
        description: >
          For a TRANSFER, the account the money lands in. NULL for merchant payments.
          Without it a transfer looked like money leaving the bank and never arriving,
          which quietly broke the "money in = money out" claim the whole platform rests on.
        data_tests:
          - relationships:
              to: ref('accounts')
              field: account_id
      - name: idempotency_key
        description: >
          Client-generated key that stops a retried payment from charging twice. The
          source enforces UNIQUE, so duplicates can never reach this layer — which is
          exactly why the test below is worth having: it verifies the guarantee survived
          CDC, Kafka, Spark, Iceberg and the MERGE, not just that the column exists.
        data_tests: [unique, not_null]
      - name: amount
        description: >
          Transaction amount as DECIMAL(15,2). Traveled the whole pipeline as a string
          (decimal.handling.mode=string) and is cast exactly once, here — money never
          touches a float.
        data_tests: [not_null]
      - name: currency
        description: ISO currency code (demo emits USD only).
        data_tests:
          - accepted_values: { values: ["USD"] }
      - name: txn_type
        description: >
          Money direction: CREDIT/SALARY = in, DEBIT/TRANSFER = out. SALARY is its own
          type rather than a kind of CREDIT because payroll has no merchant, and every
          layer downstream needs to recognise that by DECLARATION, not by guessing from
          channel, day of month and amount.
        data_tests:
          - accepted_values: { values: ["CREDIT", "DEBIT", "TRANSFER", "SALARY"] }
      - name: status
        description: >
          Lifecycle: PENDING (intent recorded, no money moved yet) -> COMPLETED (real
          money) / FAILED (no money) -> REVERSED (undone; must never be double-counted).
          Long-lived PENDING = in-doubt transaction awaiting ops attention.
        data_tests:
          - not_null
          - accepted_values: { values: ["PENDING", "COMPLETED", "FAILED", "REVERSED"] }
      - name: is_flagged
        description: >
          The bank's system SUSPECTED this transaction. Deliberately imperfect: it
          misses some real fraud and raises some false alarms — which is the only
          reason "how good is our detection" is a question worth asking.
        data_tests: [not_null]
      - name: fraud_label
        description: >
          Whether it ACTUALLY was fraud. Only knowable because this is simulated data;
          it is the answer key used to measure detection, never an input to it.
        data_tests: [not_null]
      - name: channel
        description: Where the transaction was initiated.
        data_tests:
          - accepted_values: { values: ["ATM", "POS", "ONLINE", "MOBILE", "BRANCH"] }
      - name: created_at
        description: When the source system recorded the transaction.
        data_tests: [not_null]
      - name: updated_at
        description: Last source-side change (maintained by a DB trigger).
      - name: is_deleted
        description: >
          TRUE when the source hard-deleted the row (retention purge of old FAILED
          transactions). Kept for audit; Gold excludes these.
        data_tests: [not_null]
      - name: deleted_at
        description: Source commit time of the delete event (NULL unless is_deleted).
      - name: _source_ts_ms
        description: "Lineage metadata: source commit timestamp (ms) of the applied event."
      - name: _kafka_offset
        description: >
          "Lineage metadata: Kafka offset of the applied event. Also the incremental
          high-watermark — single-partition topics make offset order = commit order."
        data_tests: [not_null]
      - name: _silver_updated_at
        description: "Lineage metadata: when dbt last touched this row."

  - name: accounts
    description: >
      Current state of customer accounts with PII PROTECTED — the only account view an
      analyst may touch. Three masking techniques, chosen per field: hash (join-able,
      irreversible), partial mask (recognisable to support staff, useless to a thief),
      generalize (analytics-grade age without birth date). Raw PII exists only in
      restricted Bronze.
    columns:
      - name: account_id
        description: Account primary key.
        data_tests: [unique, not_null]
      - name: customer_name_hash
        description: SHA-256 of customer name — distinct-countable, never reversible.
        data_tests: [not_null]
      - name: national_id_hash
        description: SHA-256 of national ID. Highest-sensitivity field, never partial-masked.
        data_tests: [not_null]
      - name: phone_masked
        description: "Partial mask: first 3 + last 2 characters visible (e.g. 090*****23)."
      - name: email_masked
        description: "Partial mask: first 2 chars of local part + full domain (e.g. ng***@gmail.com)."
      - name: birth_year
        description: >
          Generalized from date_of_birth — age analytics without a birthday. Tested for
          not_null because a silent parsing failure here is invisible: the column simply
          goes empty and every age report quietly stops working (that is exactly what the
          Avro migration caused before this test existed).
        data_tests: [not_null]
      - name: persona
        description: >
          Behavioural archetype, not a size label: it decides how often the customer
          transacts, how large the amounts are, and which channels they use. DORMANT
          customers barely transact at all, which is what makes "active customers"
          a number that can actually move.
        data_tests:
          - not_null
          - accepted_values: { values: ['SALARIED', 'DIGITAL_NATIVE', 'TRADITIONAL', 'CORPORATE', 'DORMANT'] }
      - name: home_region
        description: >
          Region the customer lives in. Region-level only — never a street address — so it needs no masking. A merchant in a different region is a classic fraud signal.
        data_tests:
          - not_null
          - accepted_values: { values: ['Metro North', 'Metro South', 'Central', 'Coastal East', 'Coastal West', 'Highlands'] }
      - name: account_type
        data_tests:
          - accepted_values: { values: ["SAVINGS", "CHECKING", "CREDIT"] }
        description: Product type of the account.
      - name: balance
        description: >
          Current balance DECIMAL(15,2). Mutates on every COMPLETED transaction, so this
          dimension changes at near-fact velocity (why accounts CDC volume is high).
        data_tests: [not_null]
      - name: created_at
        description: Account opening time.
      - name: is_deleted
        description: Soft-delete flag (accounts are never purged in the demo; always false).
        data_tests: [not_null]
      - name: _source_ts_ms
        description: "Lineage metadata: source commit timestamp of the applied event."
      - name: _kafka_offset
        description: "Lineage metadata + incremental high-watermark."
        data_tests: [not_null]
      - name: _silver_updated_at
        description: "Lineage metadata: when dbt last touched this row."

  - name: merchants
    description: >
      Current state of merchants — small, nearly-static dimension (name, category, city).
    columns:
      - name: merchant_id
        description: Merchant primary key.
        data_tests: [unique, not_null]
      - name: merchant_name
        description: Merchant display name (synthetic).
        data_tests: [not_null]
      - name: category
        description: Spend category used by Gold for per-category aggregates.
        data_tests:
          - accepted_values:
              values: ["Grocery", "Fuel", "Dining", "Retail", "Utilities", "Travel", "Health"]
      - name: region
        description: >
          Region the merchant trades in. Cities are detail; regions are what a dashboard actually groups by.
        data_tests:
          - not_null
          - accepted_values: { values: ['Metro North', 'Metro South', 'Central', 'Coastal East', 'Coastal West', 'Highlands'] }
      - name: city
        description: Merchant city (synthetic).
      - name: created_at
        description: When the merchant was registered.
      - name: is_deleted
        description: Soft-delete flag (never true in the demo).
        data_tests: [not_null]
      - name: _source_ts_ms
        description: "Lineage metadata: source commit timestamp of the applied event."
      - name: _kafka_offset
        description: "Lineage metadata + incremental high-watermark."
        data_tests: [not_null]
      - name: _silver_updated_at
        description: "Lineage metadata: when dbt last touched this row."
