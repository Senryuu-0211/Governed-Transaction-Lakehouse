name: governed-txn-lakehouse

# =============================================================================
# Phase 1 — hạ tầng CDC + lakehouse (chạy local, $0)
#   1a: postgres (logical replication) + faker  -> NGUỒN mà CDC đọc
#   1b: kafka (KRaft) + connect (Debezium) + kafka-ui  -> bắt & đệm change event
#   1c: AWS S3 (bucket thật) + iceberg-rest  -> nơi Bronze đáp xuống
# Spark KHÔNG nằm ở đây: driver chạy venv trên host (local[*]) và nối vào qua
# các cổng published — xem docs/phase-1c-bronze-design.md.
# =============================================================================

# 28-07: giới hạn log MỌI container (bài học đĩa đầy 397GB — log không giới hạn
# cũng là một nguồn phình âm thầm). 10MB × 3 file = tối đa 30MB/container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    container_name: gtl-postgres
    logging: *default-logging
    # ---- Logical replication (nền của CDC không mất event) ----
    # Debezium (Step 1b) đọc Write-Ahead Log qua 1 logical replication slot để bắt
    # MỌI thay đổi hàng (INSERT/UPDATE/DELETE) theo đúng thứ tự commit. Không có
    # wal_level=logical thì không có logical decoding -> CDC bất khả thi.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"        # >=1 mỗi kết nối replication; dư cho Debezium + thử nghiệm
      - "-c"
      - "max_replication_slots=4"  # slot CDC cần persistence; dư vài slot để test
      # CDC RISK #1: nếu slot tụt quá 10GB WAL, Postgres INVALIDATE slot (hy sinh CDC,
      # re-snapshot được) thay vì để đầy đĩa làm SẬP core DB. Thà mất CDC còn hơn sập DB.
      - "-c"
      - "max_slot_wal_keep_size=10GB"
    environment:
      # Lấy từ .env (không hardcode secret vào file versioned).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Dùng bởi init script 02_cdc_role.sh để tạo role Debezium với mật khẩu từ .env.
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      # Dùng bởi 03_extra_databases.sh để tạo user marts_ro / superset_meta.
      MARTS_RO_PASSWORD: ${MARTS_RO_PASSWORD}
      SUPERSET_META_PASSWORD: ${SUPERSET_META_PASSWORD}
    ports:
      - "5433:5432"   # 5432 thường bận (Postgres Airflow) -> source bank expose 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init/*.sql chỉ chạy khi volume TRỐNG. Đổi schema -> `down -v` rồi `up`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d banking"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G   # demo nhỏ; server 48GB đã đông nên đặt limit mọi service
    restart: unless-stopped

  faker:
    build: ./faker
    container_name: gtl-faker
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGPORT: "5432"          # trong network dùng cổng nội bộ 5432 (5433 chỉ là map ra host)
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TXN_RATE: ${TXN_RATE}       # INSERT/giây mục tiêu (từ .env)
      RANDOM_SEED: ${RANDOM_SEED} # seed để data tái lập được (reconciliation test)
    depends_on:
      postgres:
        condition: service_healthy   # đợi Postgres healthy mới bơm
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ---- Kafka KRaft (single broker, KHÔNG ZooKeeper) --------------------------
  # KRaft bỏ hẳn ZooKeeper (metadata do chính Kafka quản qua raft). Single broker
  # đủ cho demo; deploy thật dùng multi-broker/MSK. Broker vừa là controller vừa broker.
  kafka:
    image: apache/kafka:3.8.1
    container_name: gtl-kafka
    logging: *default-logging
    hostname: kafka
    ports:
      - "9093:9093"   # EXTERNAL listener cho tool ở host; nội bộ dùng kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9095
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9095,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker -> mọi replication factor = 1 (không có broker khác để nhân bản).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # ---- Kafka Connect + Debezium (Postgres connector) ------------------------
  # Image Debezium đã bundle sẵn connector Postgres. Connect chạy connector, đọc WAL
  # qua role debezium (least-privilege) và publish change event lên Kafka topic.
  connect:
    image: quay.io/debezium/connect:2.7
    container_name: gtl-connect
    logging: *default-logging
    hostname: connect
    ports:
      - "8083:8083"   # Connect REST API (đăng ký/giám sát connector)
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: gtl-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      # Single broker -> RF=1 cho các topic nội bộ của Connect.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Phase 2.5: jar Apicurio Avro converter CÓ trong image nhưng nằm ở
      # /kafka/external_libs/apicurio -> cờ này bảo entrypoint nạp vào classpath.
      ENABLE_APICURIO_CONVERTERS: "true"
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ---- Kafka UI (soi topic/message) -----------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: gtl-kafka-ui
    logging: *default-logging
    ports:
      - "8092:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gtl
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ---- STORAGE = AWS S3 THẬT (28-07: bỏ hẳn MinIO) --------------------------
  # Trước đây MinIO (S3 API) chạy như container tại đây. Đã LOẠI BỎ HOÀN TOÀN sau
  # sự cố đĩa đầy 397GB (xem .claude/CLAUDE.md) + quyết định dùng S3 thật cho đúng
  # thực tế production. Storage giờ là một bucket S3 thật (tên + region lấy từ
  # `.env`: S3_BUCKET / AWS_DEFAULT_REGION — không hard-code vào file versioned),
  # truy cập bằng IAM user least-privilege chỉ có quyền trên đúng bucket đó.
  # ⚠️ TIỀN THẬT: mỗi file ghi = 1 PUT request tính phí -> small-files không chỉ
  # phình đĩa mà ĐỐT VÍ. Vì vậy trigger stream 30s + compaction + expire +
  # remove_orphan_files + lifecycle rule là BẮT BUỘC, không phải tuỳ chọn.

  # ---- Iceberg REST catalog -------------------------------------------------
  # Catalog giữ con trỏ "bảng nào -> file metadata nào" và bảo đảm commit ACID.
  # Dùng REST (chuẩn mở, engine-agnostic) để Phần 2 thay bằng AWS Glue chỉ là đổi
  # catalog impl. Metadata lưu sqlite trên volume => sống sót qua restart; còn
  # metadata/data file thật của Iceberg thì nằm trên S3 (bucket ${S3_BUCKET}).
  # LƯU Ý version: phải TRÙNG dòng Iceberg mà Spark dùng (1.9.2) - đây là điểm
  # hỏng số 1 của bước này. 1.9.2 là giao của "image fixture có phát hành" và
  # "iceberg-spark-runtime-3.5_2.12 + iceberg-aws-bundle có trên Maven".
  # ---- MinIO: object store S3-compatible cho PHẦN 1 -------------------------
  # 06-08: QUAY LẠI MinIO cho PHẦN 1, S3 thật để dành PHẦN 2.
  #
  # VÌ SAO QUAY LẠI (không phải vì S3 tệ):
  #   Cấu hình cũ là compute-ở-nhà + storage-trên-mây — một thể lai không nằm trong
  #   kế hoạch nào, lấy nhược điểm của cả hai. Mỗi request metadata tốn 244ms khứ
  #   hồi, và nén 6.800 file nhỏ trở thành BẤT KHẢ THI (issue 006). MinIO đặt storage
  #   cạnh compute -> localhost, độ trễ ~0.
  #   S3 KHÔNG bị bỏ: `S3_ENDPOINT` trong .env quyết định chạy chế độ nào, code y
  #   nguyên. Đây chính là lời hứa endpoint-swap, giờ kiểm chứng được CẢ HAI CHIỀU.
  #
  # ⚠️ MinIO từng phình 397GB làm đầy ổ (28-07). Lần này KHÁC ở bốn điểm — đúng bốn
  #    thứ đã thiếu lúc đó: trigger 30s (không phải 5s) · `remove_orphan_files` đã
  #    chạy được · lifecycle rule · alert đĩa 80%. Cộng thêm HẠN MỨC CỨNG 300GB ở
  #    minio-init dưới đây.
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: gtl-minio
    logging: *default-logging
    hostname: minio
    command: server /data --console-address ":9002"
    ports:
      - "9001:9000"   # S3 API   -> Spark ở host trỏ http://localhost:9001
      - "9002:9002"   # Console web (soi bucket/file bằng mắt)
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # 24-07: 512M nghẹt (86%) khi stream + dbt + push chạy song song -> AWS SDK
          # "Connection reset". MinIO là kho trung tâm của cả pipeline.
          memory: 1536M
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: gtl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      STORAGE_QUOTA: ${STORAGE_QUOTA:-300gb}
    # HẠN MỨC CỨNG: MinIO TỪ CHỐI ghi khi bucket vượt ngưỡng. Đây là lớp bảo vệ mà
    # sự cố 397GB đã thiếu — lúc đó không có gì chặn, đĩa cứ đầy tới 100% rồi chết
    # cả SSH lẫn IDE. Giờ pipeline sẽ lỗi RÕ RÀNG khi chạm trần, thay vì giết máy.
    # Thử `mc quota set` (cú pháp mới) trước, fallback sang `mc admin bucket quota`.
    entrypoint: >
      /bin/sh -c "
      mc alias set gtl http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing gtl/$$S3_BUCKET &&
      ( mc quota set gtl/$$S3_BUCKET --size $$STORAGE_QUOTA ||
        mc admin bucket quota gtl/$$S3_BUCKET --hard $$STORAGE_QUOTA ||
        echo 'CANH BAO: khong dat duoc quota - kiem tra thu cong' ) &&
      echo \"bucket $$S3_BUCKET san sang, quota $$STORAGE_QUOTA\"
      "
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    container_name: gtl-iceberg-rest
    logging: *default-logging
    hostname: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      # Quy ước biến: CATALOG_ + tên; "__" -> "-", "_" -> "."
      # S3 THẬT: warehouse = prefix trong bucket. KHÔNG set s3.endpoint (SDK tự dùng
      # endpoint AWS theo region) và KHÔNG path-style (S3 thật dùng virtual-host style).
      CATALOG_WAREHOUSE: s3://${S3_BUCKET}/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      # PHẦN 1 (MinIO): endpoint nội bộ container + path-style (MinIO không hỗ trợ
      # virtual-host style). PHẦN 2 (S3 thật): xoá hai dòng này -> SDK tự resolve
      # endpoint AWS theo region và dùng virtual-host style.
      CATALOG_S3_ENDPOINT: ${CATALOG_S3_ENDPOINT:-http://minio:9000}
      CATALOG_S3_PATH__STYLE__ACCESS: "${S3_PATH_STYLE:-true}"
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      # Backend catalog = POSTGRES (db riêng `iceberg_catalog`, KHÔNG đụng db banking).
      # Lịch sử: SQLite cắn 2 lần trong 2 ngày — SQLITE_BUSY (nhiều writer, 22-07) rồi
      # SQLITE_BUSY_SNAPSHOT (WAL mode, khi dbt vào thêm writer, 24-07). busy_timeout
      # không cứu được BUSY_SNAPSHOT. Postgres backend xoá hẳn giới hạn 1-writer + xoá
      # SPOF file sqlite (OPTIMIZATION.md mục 2.5). Đây cũng là đường production chuẩn
      # (Postgres/Glue/Nessie làm JDBC backend).
      CATALOG_URI: "jdbc:postgresql://postgres:5432/iceberg_catalog"
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      # S3FileIO đọc credential theo chuẩn AWS -> IAM user least-privilege (1 bucket).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_DEFAULT_REGION}
    volumes:
      # Image không bundle driver Postgres -> mount jar rồi chạy bằng -cp (xem command).
      - ./jars/postgresql-42.7.4.jar:/opt/jars/postgresql.jar:ro
    # Image mặc định `java -jar` (bỏ qua classpath ngoài) -> override sang -cp để
    # nạp thêm driver. Main class lấy từ log khởi động của chính image này.
    # -Xmx1g: heap mặc định của JVM = ~25% mem_limit. Với limit 512M cũ -> chỉ ~128MB,
    # OOM khi stream commit backlog lớn / chạy song song dbt (sự cố 26-07). Set -Xmx tường
    # minh 1g (trong mem_limit 1536M bên dưới) để catalog chịu được commit đồng thời.
    command: ["java", "-Xmx1g", "-cp", "iceberg-rest-adapter.jar:/opt/jars/postgresql.jar", "org.apache.iceberg.rest.RESTCatalogServer"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M   # 512M -> 1536M: chứa heap 1g (-Xmx) + metaspace/off-heap. Host dư 37G.
    restart: unless-stopped

  # ---- Apicurio Schema Registry (Phase 2.5) --------------------------------
  # HỢP ĐỒNG schema ở cổng Kafka: Debezium đăng ký schema Avro của mỗi topic;
  # đổi schema không tương thích (backward) bị REGISTRY CHẶN thay vì để Silver
  # lặng lẽ ra NULL. Storage = kafkasql (schema lưu trong 1 topic Kafka, sống sót
  # qua restart, không cần DB riêng — giống cách Confluent SR làm).
  # Bật ccompat API (/apis/ccompat/v7) để tooling/Spark đọc theo chuẩn Confluent.
  apicurio:
    image: apicurio/apicurio-registry-kafkasql:2.6.13.Final
    container_name: gtl-apicurio
    logging: *default-logging
    hostname: apicurio
    ports:
      - "8087:8080"   # 8081 bận (Airflow P1), 8181 iceberg-rest -> chọn 8087
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Bật CORS + giữ mặc định compatibility do connector set per-artifact.
      QUARKUS_HTTP_CORS: "true"
    depends_on:
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/apis/registry/v2/system/info"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  # ---- Superset: BI cho business (đường A — đọc marts Postgres, không đọc Iceberg
  # trực tiếp vì Spark-đọc-Iceberg quá chậm cho click-latency). ---------------
  superset:
    build: ./superset          # apache/superset:4.1.1 + psycopg2-binary
    image: gtl-superset:4.1.1
    container_name: gtl-superset
    logging: *default-logging
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_META_PASSWORD: ${SUPERSET_META_PASSWORD}
      MARTS_RO_PASSWORD: ${MARTS_RO_PASSWORD}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - ./superset/bootstrap.sh:/app/bootstrap.sh:ro
    entrypoint: ["bash", "/app/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

volumes:
  pgdata:
  kafka-data:
  # 06-08: dựng lại cho PHẦN 1. Volume cũ từng phình 397GB làm đầy ổ (28-07) —
  # lần này có HẠN MỨC CỨNG 300GB ở minio-init + 4 lớp phòng ngừa đã thiếu lúc đó.
  minio-data:
